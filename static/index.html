<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Music Mood Agent</title>
<style>
:root{--bg:#0f0f1a;--surface:#1a1a2e;--primary:#e94560;--primary-hover:#ff6b81;--text:#eee;--text-muted:#888;--user-bg:#16213e;--bot-bg:#1a1a2e;--input-bg:#16213e;--border:#2a2a4a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.header-info h1{font-size:1.3rem;background:linear-gradient(135deg,var(--primary),#ff6b81,#ffd32a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-info p{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.key-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:16px;font-size:.75rem;cursor:pointer;transition:all .2s}
.key-btn:hover{border-color:var(--primary);color:var(--text)}
.key-btn.has-key{border-color:#2ed573;color:#2ed573}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;line-height:1.5;font-size:.9rem;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.bot .label{font-size:.7rem;color:var(--primary);font-weight:600;margin-bottom:4px}
.input-area{padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px}
.input-area input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:24px;background:var(--input-bg);color:var(--text);font-size:.9rem;outline:none}
.input-area input:focus{border-color:var(--primary)}
.input-area button{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:background .2s}
.input-area button:hover{background:var(--primary-hover)}
.input-area button:disabled{opacity:.5;cursor:not-allowed}
.typing{align-self:flex-start;color:var(--text-muted);font-size:.8rem;padding:4px 0}
.typing::after{content:'...';animation:dots 1.5s infinite}
@keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
@media(max-width:600px){.msg{max-width:90%}.header-info h1{font-size:1.1rem}}
</style>
</head>
<body>
<div class="header">
<div class="header-info">
<h1>🎵 Music Mood Agent</h1>
<p>Kể tâm trạng của bạn, tôi sẽ chọn nhạc phù hợp!</p>
</div>
<button id="keyBtn" class="key-btn" onclick="promptApiKey()">🔑 Cài API Key</button>
</div>
<div class="chat" id="chat">
<div class="msg bot"><div class="label">🎵 Music Agent</div>Xin chào! Hãy cho tôi biết tâm trạng của bạn, tôi sẽ gợi ý nhạc phù hợp cho bạn. 🎶

Ví dụ: "Tôi đang buồn", "I'm feeling happy", "Tôi muốn nghe nhạc Hàn Quốc vui vẻ"</div>
</div>
<div class="input-area">
<input type="text" id="input" placeholder="Nhập tâm trạng của bạn..." autocomplete="off">
<button id="send" onclick="sendMsg()">Gửi</button>
</div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),btn=document.getElementById('send'),keyBtn=document.getElementById('keyBtn');

function getApiKey(){
  const urlKey=new URLSearchParams(location.search).get('key');
  if(urlKey){localStorage.setItem('agent_key',urlKey);return urlKey;}
  return localStorage.getItem('agent_key')||'';
}

function updateKeyBtn(){
  const k=getApiKey();
  if(k){keyBtn.textContent='🔑 Key: Đã lưu';keyBtn.className='key-btn has-key';}
  else{keyBtn.textContent='🔑 Nhập API Key';keyBtn.className='key-btn';}
}

function promptApiKey(){
  const cur=getApiKey();
  const k=prompt('Nhập AGENT_API_KEY (được cấp khi deploy):',cur);
  if(k!==null){
    localStorage.setItem('agent_key',k.trim());
    updateKeyBtn();
  }
}

updateKeyBtn();
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)sendMsg()});

function addMsg(text,cls){
  const d=document.createElement('div');d.className='msg '+cls;
  if(cls==='bot')d.innerHTML='<div class="label">🎵 Music Agent</div>'+text.replace(/\n/g,'<br>');
  else d.textContent=text;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}

async function sendMsg(){
  const q=input.value.trim();if(!q)return;
  let key=getApiKey();
  if(!key){
    key=prompt('Vui lòng nhập AGENT_API_KEY để sử dụng hệ thống:');
    if(!key)return;
    localStorage.setItem('agent_key',key.trim());
    updateKeyBtn();
  }
  input.value='';addMsg(q,'user');
  btn.disabled=true;
  const typ=document.createElement('div');typ.className='typing';typ.textContent='Đang chọn nhạc';
  chat.appendChild(typ);chat.scrollTop=chat.scrollHeight;
  try{
    const headers={'Content-Type':'application/json','X-API-Key':key};
    const r=await fetch('/ask',{method:'POST',headers,body:JSON.stringify({question:q})});
    typ.remove();
    if(r.status===401){
      addMsg('⚠️ API Key không hợp lệ hoặc đã hết hạn. Hãy bấm nút "🔑 Nhập API Key" góc trên để cập nhật.','bot');
      localStorage.removeItem('agent_key');
      updateKeyBtn();
      return;
    }
    if(!r.ok){const e=await r.json().catch(()=>({}));addMsg('Lỗi: '+(e.detail||r.statusText),'bot');return}
    const d=await r.json();
    addMsg(d.answer,'bot');
  }catch(e){typ.remove();addMsg('Lỗi kết nối: '+e.message,'bot')}
  finally{btn.disabled=false;input.focus()}
}
input.focus();
</script>
</body>
</html>
